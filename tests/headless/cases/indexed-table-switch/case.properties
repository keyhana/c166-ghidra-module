# Indexed dispatch-table jmpi: mov Rw,[Rw+#off]; jmpi [Rw]
# This form (used by C166 CAPCOM interrupt handlers) is NOT resolved by the
# c166_switch_load injector; without C166SwitchAnalyzer the jmpi stays an
# unresolved dynamic goto and the decompiler cannot structure the switch.
processor=C166:LE:16:default
compiler=tasking
loadBase=0x002000
entryPoints=0x002010
decompile=0x002010
registers=DPP0:0x0
c166SwitchAnalysis=true
